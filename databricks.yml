# Declarative Automation Bundle for the flights learning project.
# Trimmed to run on Databricks Free Edition (serverless only).
# See LEARNING.md for what changed and the remaining exercise.
bundle:
  name: flights_simple

include:
  - resources/*.yml

variables:
  catalog:
    default: "workspace"
  database:
    default: ${resources.schemas.project_schema.name}

targets:
  # Development target for Databricks Free Edition.
  # mode: development prefixes deployed resource names (for example the
  # flights schema) so each developer gets an isolated copy.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-4bb6302f-905a.cloud.databricks.com/

    resources:
      schemas:
        project_schema:
          name: flights
          catalog_name: ${var.catalog}
          comment: "Schema for flight data"
